# tencentcloud-agentobs-sdk-dsh 配置示例
# 将以下内容添加到 ~/.dsh/profiles/<profile>/cordis.patch.yml
#
# 最小配置（也可以全部用环境变量代替）:
- id: cls-observability
  config:
    endpoint: ap-guangzhou.cls.tencentcs.com
    topicId: your-topic-id-here
    secretId: your-secret-id-here
    secretKey: your-secret-key-here

